<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESTA · Kiểm thử responsive</title>
  <style>
    body { margin: 0; background: #dce3e9; font: 14px Arial; color: #16344f; }
    .toolbar { position: sticky; top: 0; z-index: 2; padding: 12px; background: #fff; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar button, .toolbar select { padding: 9px 16px; border: 1px solid #cbd6de; border-radius: 5px; background: #edf3f8; color: #16344f; cursor: pointer; }
    .stage { overflow: auto; padding: 15px; }
    iframe { display: block; border: 0; background: #fff; max-width: none; height: 900px; margin: 0 auto; }
    .note { font-size: 12px; color: #805b16; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>ESTA · KIỂM THỬ GIAO DIỆN</strong>
    <label>Nguồn <select id="source"><option value="browser-fixture.html">Dữ liệu giả lập</option><option value="../">Ứng dụng thật</option></select></label>
    <button data-width="1440">Desktop 1440</button>
    <button data-width="1024">Tablet 1024</button>
    <button data-width="768">Tablet 768</button>
    <button data-width="390">Mobile 390</button>
    <button data-width="320">Mobile 320</button>
    <span id="size">1440 px</span>
    <span id="note" class="note">DỮ LIỆU GIẢ LẬP · Không kết nối tài khoản hoặc cơ sở dữ liệu</span>
  </div>
  <div class="stage"><iframe id="preview" title="Báo cáo thử nghiệm" src="browser-fixture.html" style="width:1440px"></iframe></div>
  <script>
    const preview = document.getElementById('preview');
    document.querySelectorAll('[data-width]').forEach(button => {
      button.onclick = () => {
        preview.style.width = button.dataset.width + 'px';
        document.getElementById('size').textContent = button.dataset.width + ' px';
      };
    });
    document.getElementById('source').onchange = event => {
      preview.src = event.target.value;
      document.getElementById('note').textContent = event.target.value === '../'
        ? 'ỨNG DỤNG THẬT · Dùng phiên đăng nhập và quyền hiện hữu; thao tác lưu sẽ ghi dữ liệu thật'
        : 'DỮ LIỆU GIẢ LẬP · Không kết nối tài khoản hoặc cơ sở dữ liệu';
    };
  </script>
</body>
</html>
