<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTA · Kiểm thử tài khoản nhiều dự án</title><style>body{margin:0;background:#e4e0d8;color:#16344f;font:14px Arial}.toolbar{padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#f2ede4}.toolbar button{padding:9px 14px;border:1px solid #a6b8c7;border-radius:7px;background:#d9e3ec;color:#16344f;cursor:pointer}.stage{overflow:auto;padding:12px}iframe{display:block;border:0;height:1000px;margin:auto}small{color:#586774}</style></head><body><div class="toolbar"><b>KIỂM THỬ · Tài khoản đa dự án</b><button data-width="1440">Desktop 1440</button><button data-width="390">Mobile 390</button><button data-width="320">Mobile 320</button><small>Dữ liệu giả lập · Các thao tác chỉ lưu trong trang kiểm thử</small></div><div class="stage"><iframe id="preview" title="Tài khoản kỹ thuật thử nghiệm" src="admin-access-fixture.html" style="width:1440px"></iframe></div><script>document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>document.getElementById('preview').style.width=button.dataset.width+'px');</script></body></html>
