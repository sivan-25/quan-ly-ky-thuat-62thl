name: Refresh ESTA PWA icons
on:
  push:
    branches:
      - feat/esta-approved-icons-android-ios
    paths:
      - icons/esta-approved-source.jpg
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout icon branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate icons
        run: python tools/generate_pwa_icons.py
      - name: Commit generated icons to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(pwa): render approved ESTA icon for Android and iPhone"
            git push origin HEAD:feat/esta-approved-icons-android-ios
          fi
