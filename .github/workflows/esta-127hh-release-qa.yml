name: ESTA technician UX validation

on:
  push:
    branches: [release-127hh-technician-ux-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-and-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript regression tests
        run: npm test
      - name: Install isolated browser test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Serve local-only website
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/esta-ux.log 2>&1 &
          sleep 3
          curl --fail --silent http://127.0.0.1:8766/ >/dev/null
      - name: Mock technician first-use browser flow (no external requests)
        run: node tests/tech-127-ux-smoke.cjs
      - name: Keep evidence for user review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esta-tech-ux-checks
          path: tech-ux-review/
          if-no-files-found: warn

  pdf-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
