name: ESTA Browser QA

on:
  push:
    branches:
      - "feat/130hh-style1-main"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright for QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local ESTA site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/esta-http.log 2>&1 &
          echo $! > /tmp/esta-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/esta-http.log
          exit 1

      - name: Run browser user-flow QA
        run: node tests/style-one-browser.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-one-130hh-browser-screenshots
          path: artifacts/style-one-browser
          if-no-files-found: ignore
          retention-days: 7
