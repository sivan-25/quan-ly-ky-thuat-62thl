name: ESTA safe performance (current main base)
on:
  push:
    branches: [perf-esta-minimal-current-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  browser-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 30d36603dbcbeb306d406b8d97234a2366f401ef
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory baseline >/tmp/esta-base.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/esta-new.log 2>&1 &
          sleep 3
          curl --fail -s http://127.0.0.1:8765/ >/dev/null
          curl --fail -s http://127.0.0.1:8766/ >/dev/null
      - run: node tests/request-count-comparison.cjs
      - run: node tests/browser-visual-parity.cjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esta-safe-perf-current-main-visual
          path: visual-artifacts/
          if-no-files-found: warn
