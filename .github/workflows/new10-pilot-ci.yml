name: NEW10 Pilot CI

on:
  push:
    branches:
      - pilot-new10-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new10-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESTA regression suite
        run: npm test

      - name: Install pinned Playwright for CI only
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Install Python report dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Start ESTA local server
        run: |
          ESTA_DEV_PORT=8080 python3 tools/dev_server.py > /tmp/esta-new10-server.log 2>&1 &
          echo $! > /tmp/esta-new10-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esta-new10-server.log
          exit 1

      - name: Run NEW10 browser pilot checks
        run: npx playwright test tests/e2e/new10-pilot.spec.mjs

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: new10-browser-diagnostics
          path: |
            test-results
            playwright-report
            /tmp/esta-new10-server.log
          if-no-files-found: ignore
          retention-days: 7
