name: PDF regression

on:
  push:
    branches: [main]
    paths:
      - "api/esta_report.py"
      - "reporting/**"
      - "tests/test_pdf.py"
      - ".github/workflows/pdf-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/esta_report.py"
      - "reporting/**"
      - "tests/test_pdf.py"
      - ".github/workflows/pdf-regression.yml"
  workflow_dispatch:

jobs:
  pdf-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install PDF dependencies
        run: pip install -r requirements.txt
      - name: Run PDF regression and benchmark
        run: python -m unittest discover -s tests -p "test_pdf.py" -v
