name: ESTA desktop/mobile visual parity

on:
  workflow_dispatch:
  push:
    branches: [optimize-esta-safe]
    paths:
      - "app.js"
      - "demo-lab.js"
      - "command-center.js"
      - "index.html"
      - "**/*.css"
      - "tests/browser-visual-parity.cjs"
      - "tests/request-count-comparison.cjs"
      - ".github/workflows/esta-visual-parity.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout production main baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install isolated visual-test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Start isolated static HTTP servers (no real Supabase)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory baseline > /tmp/esta-baseline.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/esta-candidate.log 2>&1 &
          sleep 3
          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
          curl --fail --silent http://127.0.0.1:8766/ > /dev/null
      - name: Compare actual production and optimized request counts with isolated fixtures
        run: node tests/request-count-comparison.cjs
      - name: Capture and compare screenshots for Admin and four projects
        run: node tests/browser-visual-parity.cjs
      - name: Preserve visual evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esta-visual-parity
          path: visual-artifacts/
          if-no-files-found: warn
