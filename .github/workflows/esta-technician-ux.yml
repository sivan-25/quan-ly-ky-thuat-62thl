name: ESTA technician UX simulation
on:
  push:
    branches: [optimize-esta-safe]
    paths:
      - "tests/technician-first-use-ux.cjs"
      - ".github/workflows/esta-technician-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Start local-only static test server
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/esta-tech.log 2>&1 &
          sleep 3
          curl --fail --silent http://127.0.0.1:8766/ > /dev/null
      - name: Simulate new project technician without accessing production data
        run: node tests/technician-first-use-ux.cjs
      - name: Save technical first-use screenshots and UX report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esta-technician-first-use
          path: technician-ux-artifacts/
          if-no-files-found: warn
