name: ESTA linked systems and maintenance tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'maintenance-130.js'
      - 'upgrade-equipment.js'
      - 'maintenance-130.css'
      - 'upgrade-equipment-reference.css'
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/maintenance-link-ci.yml'
  workflow_dispatch:
jobs:
  test:
    name: JavaScript integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify 130HH phone maintenance controls
        run: node tests/maintenance-130-mobile-compact.test.cjs
      - name: Check asset modal HTML, dates and fixed controls
        run: node tests/maintenance-asset-mobile-modal.test.cjs
      - name: Run ESTA test suite
        run: npm test
