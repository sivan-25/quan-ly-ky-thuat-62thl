name: ESTA safe optimization verification

on:
  push:
    branches: [optimize-esta-safe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Static JS/CSS asset references
        run: node tests/static-assets.test.cjs
      - name: Existing ESTA JavaScript regression suite
        run: npm test

  pdf-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked-compatible PDF dependencies
        run: python -m pip install -r requirements.txt
      - name: Existing ESTA Python regression suite
        run: python -m unittest discover -s tests -v
