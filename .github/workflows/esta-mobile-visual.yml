name: ESTA Mobile Browser Visual Parity

on:
  push:
    paths:
      - 'demo-mobile.css'
      - 'inventory-mobile-cards.css'
      - 'tests/stock-movement-mobile-browser.cjs'
      - 'tests/material-editor-mobile-browser.cjs'
      - 'app.js'
      - 'tests/work-edit-mobile-shared-form.cjs'
      - 'update-lab.css'
      - 'tests/work-date-mobile-browser.cjs'
      - '.github/workflows/esta-mobile-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'style.css'
      - 'demo-mobile.css'
      - 'contractor.css'
      - 'maintenance-130.css'
      - 'maintenance-readability.css'
      - 'maintenance-redesign.css'
      - 'upgrade-equipment.css'
      - 'upgrade-equipment-compact.css'
      - 'upgrade-equipment-reference.css'
      - 'four-project-compact.css'
      - 'tests/four-project-system-rail-geometry.cjs'
      - 'index.html'
      - 'esta-brand-130-complete.css'
      - 'tests/130hh-brand-complete-browser.cjs'
      - 'tests/browser-visual-parity.cjs'
      - 'tests/mobile-usability-audit.cjs'
      - '.github/workflows/esta-mobile-visual.yml'
  workflow_dispatch:

jobs:
  material-webkit-colors:
    name: Material editor colors in Safari WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test engine
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Serve material form fixture
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/esta-material-webkit.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8766/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/esta-material-webkit.log
          exit 1
      - name: Check white material fields and navy labels in WebKit
        run: ESTA_MATERIAL_BROWSER=webkit node tests/material-editor-mobile-browser.cjs
      - name: Upload WebKit material screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esta-material-webkit-colors
          path: visual-artifacts/material-editor/
          if-no-files-found: ignore
          retention-days: 7

  date-control-geometry:
    name: Measured 44px work date across mobile viewports
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install geometry test browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Start static browser fixture
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/esta-work-date.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8766/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/esta-work-date.log
          exit 1
      - name: Measure mobile date input and surface (add and edit)
        run: node tests/work-date-mobile-browser.cjs
      - name: Verify stock modal matches work form on four projects
        run: node tests/stock-movement-mobile-browser.cjs
      - name: Verify material Add/Edit on four projects
        run: node tests/material-editor-mobile-browser.cjs
      - name: Verify shared mobile edit form and unchanged desktop drawer
        run: node tests/work-edit-mobile-shared-form.cjs
      - name: Upload date measurements screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esta-work-date-44px
          path: visual-artifacts/date-44px/
          if-no-files-found: ignore
          retention-days: 7

  mobile-browser:
    name: Four-project Chromium screenshot and DOM parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: candidate
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7
          # GitHub's ubuntu-latest image already includes Chromium's shared system libraries.
          # Install only the Playwright browser here; avoid a full apt dependency refresh on every CSS commit.
          npx playwright install chromium
      - name: Start isolated static test servers
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory baseline > /tmp/esta-baseline.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory candidate > /tmp/esta-candidate.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null && curl -fsS http://127.0.0.1:8766/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/esta-baseline.log /tmp/esta-candidate.log
          exit 1
      - name: Verify compact Admin and four project home UI
        working-directory: candidate
        run: node tests/overview-projects-mobile-compact.test.cjs
      - name: Verify 130HH complete ESTA brand on every page and device width
        working-directory: candidate
        run: node tests/130hh-brand-complete-browser.cjs
      - name: Check asset modal save visibility on iPhone viewports
        working-directory: candidate
        run: node tests/maintenance-asset-mobile-browser.cjs
      - name: Check maintenance plan field pairs and horizontal scrolling
        working-directory: candidate
        run: node tests/maintenance-plan-mobile-browser.cjs
      - name: Audit approved compact maintenance across all four buildings
        working-directory: candidate
        run: node tests/maintenance-four-building-mobile-parity.cjs
      - name: Verify Admin editor mobile form geometry
        working-directory: candidate
        run: node tests/admin-work-editor-mobile-browser.cjs
      - name: Verify all four system menus on phones and laptops
        working-directory: candidate
        run: node tests/four-project-system-rail-geometry.cjs
      - name: Verify 130HH pinned material and tool table headers with long lists
        working-directory: candidate
        run: node tests/130hh-inventory-table-sticky-browser.cjs
      - name: Verify inventory popup names, help text, and existing actions
        working-directory: candidate
        run: node tests/130hh-inventory-modal-semantics.test.cjs
      - name: Compare real Chromium screenshots for four projects
        working-directory: candidate
        env:
          ESTA_VISUAL_TOUCH_IMPROVEMENTS: '1'
          ESTA_VISUAL_COMPACT_ADMIN_OVERVIEW: '1'
          ESTA_VISUAL_COMPACT_PROJECT_OVERVIEW: '1'
          ESTA_VISUAL_WIDTHS: '320,390,768'
          ESTA_VISUAL_SCENARIOS: 'login,admin,admin-home,home-62THL,home-68PĐL,home-127HH,home-130HH,work-62THL,work-68PĐL,work-127HH,work-130HH,edit-62THL,edit-130HH,energy-68PĐL,inventory-62THL,maintenance-68PĐL,maintenance-62THL,maintenance-127HH,maintenance-130HH,contractor-130HH,incident-127HH,inspection-130HH,documents-62THL,reports-68PĐL'
        run: node tests/browser-visual-parity.cjs
      - name: Audit real mobile layout and touch targets for four buildings
        working-directory: candidate
        run: node tests/mobile-usability-audit.cjs
      - name: Archive screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esta-mobile-visual-parity
          path: |
            candidate/visual-artifacts/
            candidate/mobile-audit/
          if-no-files-found: ignore
          retention-days: 7
