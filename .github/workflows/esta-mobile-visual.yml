name: ESTA Mobile Browser Visual Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'style.css'
      - 'demo-mobile.css'
      - 'contractor.css'
      - 'maintenance-130.css'
      - 'maintenance-readability.css'
      - 'maintenance-redesign.css'
      - 'upgrade-equipment.css'
      - 'upgrade-equipment-compact.css'
      - 'upgrade-equipment-reference.css'
      - 'index.html'
      - 'tests/browser-visual-parity.cjs'
      - 'tests/mobile-usability-audit.cjs'
      - '.github/workflows/esta-mobile-visual.yml'
  workflow_dispatch:

jobs:
  mobile-browser:
    name: Four-project Chromium screenshot and DOM parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: candidate
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7
          npx playwright install --with-deps chromium
      - name: Start isolated static test servers
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory baseline > /tmp/esta-baseline.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory candidate > /tmp/esta-candidate.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null && curl -fsS http://127.0.0.1:8766/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/esta-baseline.log /tmp/esta-candidate.log
          exit 1
      - name: Compare real Chromium screenshots for four projects
        working-directory: candidate
        env:
          ESTA_VISUAL_WIDTHS: '320,390,768'
          ESTA_VISUAL_SCENARIOS: 'login,admin,admin-home,work-62THL,work-68PĐL,work-127HH,work-130HH,edit-62THL,edit-130HH,energy-68PĐL,inventory-62THL,maintenance-68PĐL,maintenance-62THL,maintenance-127HH,maintenance-130HH,contractor-130HH,incident-127HH,inspection-130HH,documents-62THL,reports-68PĐL'
        run: node tests/browser-visual-parity.cjs
      - name: Audit real mobile layout and touch targets for four buildings
        working-directory: candidate
        run: node tests/mobile-usability-audit.cjs
      - name: Archive screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esta-mobile-visual-parity
          path: |
            candidate/visual-artifacts/
            candidate/mobile-audit/
          if-no-files-found: ignore
          retention-days: 7
