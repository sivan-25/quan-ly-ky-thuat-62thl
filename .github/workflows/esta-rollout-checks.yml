name: ESTA Four-Project Rollout Checks
on:
  push:
    branches:
      - feature/esta-four-project-rollout-phase1-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollout-pdf-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: PDF, images, signature and pagination regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
